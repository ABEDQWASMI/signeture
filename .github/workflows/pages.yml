name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd SignatureApp
          npm install

      - name: Build web app
        run: |
          cd SignatureApp
          npx expo export --platform web --clear

      - name: Copy to docs
        run: |
          cd SignatureApp
          rm -rf docs
          mkdir -p docs
          cp -r dist/* docs/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v2
        with:
          path: 'SignatureApp/docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2
